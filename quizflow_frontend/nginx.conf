server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # /etc/nginx/mime.types сам является полным блоком types{} — include
    # его ВНУТРИ другого types{} даёт synax error (двойная вложенность).
    # Поэтому здесь полный список того, что реально отдаёт этот сайт, а
    # не попытка дополнить встроенный: обычные веб-типы (без них у самого
    # SPA будут неверные Content-Type на JS/CSS/SVG) плюс аудио/видео,
    # которых во встроенном mime.types нет — без них браузер предлагал бы
    # скачать файл вместо проигрывания в <audio>/<video>.
    types {
        text/html html htm;
        text/css css;
        application/javascript js mjs;
        application/json json;
        image/svg+xml svg svgz;
        image/png png;
        image/jpeg jpg jpeg;
        image/gif gif;
        image/webp webp;
        image/x-icon ico;
        font/woff woff;
        font/woff2 woff2;
        audio/mpeg mp3;
        audio/wav wav;
        audio/ogg ogg;
        audio/mp4 m4a;
        video/mp4 mp4;
        video/webm webm;
        video/ogg ogv;
    }

    # SPA: прямой переход браузера на /oauth-callback, /reset-password и
    # т.п. должен открыть приложение (а не 404) — весь роутинг между
    # этими путями решает сам React на клиенте, см. App() в quizflow.jsx.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    location /media/ {
        alias /usr/share/nginx/media/;
    }

    # WebSocket игры — отдельный location: нужны заголовки Upgrade и
    # длинный таймаут, соединение живёт всю игру, а не один запрос-ответ.
    location /ws/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
    }

    # AI-сервис генерации квизов — префикс /ai/ снимается перед
    # проксированием (trailing slash в proxy_pass), у самого сервиса
    # эндпоинт лежит по /api/generate-quiz без префикса.
    location /ai/ {
        proxy_pass http://ai_service:8100/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
